<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 — 大健康 CRM v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary:#2563EB; --color-primary-hover:#1D4ED8; --color-primary-light:#EFF6FF; --color-primary-ring:rgba(37,99,235,0.25);
  --color-success:#10B981; --color-success-bg:#ECFDF5; --color-success-text:#047857;
  --color-warning:#F59E0B; --color-warning-bg:#FFFBEB; --color-warning-text:#B45309;
  --color-error:#EF4444; --color-error-bg:#FEF2F2; --color-error-text:#B91C1C;
  --color-bg:#F9FAFB; --color-surface:#FFFFFF;
  --color-text-primary:#111827; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF; --color-text-inverse:#FFFFFF;
  --color-border:#E5E7EB; --color-border-hover:#D1D5DB; --color-border-light:#F3F4F6;
  --sidebar-width:264px; --header-height:64px; --drawer-width:480px;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --shadow-xs:0 1px 2px rgba(16,24,40,0.04);
  --shadow-sm:0 1px 3px rgba(16,24,40,0.06),0 1px 2px rgba(16,24,40,0.04);
  --shadow-md:0 4px 8px -2px rgba(16,24,40,0.06),0 2px 4px -2px rgba(16,24,40,0.04);
  --shadow-lg:0 12px 16px -4px rgba(16,24,40,0.08),0 4px 6px -2px rgba(16,24,40,0.04);
  --shadow-xl:0 20px 24px -4px rgba(16,24,40,0.10),0 8px 8px -4px rgba(16,24,40,0.04);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --text-xs:0.75rem; --text-sm:0.8125rem; --text-base:0.9375rem; --text-lg:1.125rem; --text-xl:1.375rem; --text-2xl:1.75rem;
  --transition-fast:150ms cubic-bezier(0.4,0,0.2,1);
  --transition-base:200ms cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-bg);line-height:1.6;min-height:100vh;}
.app{display:flex;min-height:100vh;}

.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#0B1B3D 0%,#0F1E3F 50%,#0A1530 100%);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform var(--transition-base);color:#E2E8F0;}
.sidebar-header{padding:var(--space-5) var(--space-5) var(--space-4);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:var(--space-3);min-height:var(--header-height);}
.sidebar-logo{width:36px;height:36px;border-radius:var(--radius-md);background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 0 16px rgba(59,130,246,0.4);}
.sidebar-logo svg{width:20px;height:20px;}
.sidebar-brand{font-size:var(--text-lg);font-weight:700;color:#FFFFFF;letter-spacing:-0.025em;}
.sidebar-brand span{color:#60A5FA;}
.sidebar-version{margin-left:auto;font-size:10px;font-weight:600;color:#93C5FD;background:rgba(96,165,250,0.12);padding:2px 8px;border-radius:4px;}
.sidebar-nav{flex:1;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-3);border-radius:var(--radius-md);color:rgba(255,255,255,0.7);text-decoration:none;font-size:var(--text-sm);font-weight:500;cursor:pointer;transition:all var(--transition-fast);position:relative;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#FFFFFF;}
.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,0.18) 0%,rgba(96,165,250,0.06) 100%);color:#FFFFFF;font-weight:600;}
.nav-item.active .nav-icon{color:#60A5FA;}
.nav-item .nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);}
.nav-item .nav-icon svg{width:20px;height:20px;}
.nav-item .nav-label{flex:1;}
.nav-item .nav-indicator{position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);width:3px;height:20px;background:#60A5FA;border-radius:0 3px 3px 0;transition:transform var(--transition-base);box-shadow:0 0 8px #60A5FA;}
.nav-item.active .nav-indicator{transform:translateY(-50%) scaleY(1);}
.sidebar-footer{padding:var(--space-3);border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-user{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);cursor:pointer;}
.sidebar-user:hover{background:rgba(255,255,255,0.06);}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--text-xs);font-weight:600;flex-shrink:0;}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-name{font-size:var(--text-sm);font-weight:600;color:#FFFFFF;}
.sidebar-user-role{font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);}
.sidebar-user svg{width:16px;height:16px;color:rgba(255,255,255,0.5);}

.main{flex:1;margin-left:var(--sidebar-width);min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--color-surface);border-bottom:1px solid var(--color-border);height:var(--header-height);padding:0 var(--space-8);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:var(--space-4);}
.page-title-area{display:flex;align-items:center;gap:var(--space-3);}
.page-title-area h1{font-size:var(--text-xl);font-weight:700;color:var(--color-text-primary);letter-spacing:-0.02em;}
.page-title-badge{font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);background:#F3F4F6;padding:2px 10px;border-radius:12px;}
.topbar-right{display:flex;align-items:center;gap:var(--space-2);}
.topbar-btn{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.topbar-btn:hover{background:#F9FAFB;color:var(--color-text-primary);}
.topbar-btn svg{width:18px;height:18px;}
.topbar-btn .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;background:var(--color-error);border-radius:50%;border:1.5px solid var(--color-surface);}
.topbar-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--text-sm);font-weight:600;cursor:pointer;flex-shrink:0;margin-left:var(--space-1);}

.page{padding:var(--space-6) var(--space-8) var(--space-8);flex:1;}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;padding:8px 16px;border-radius:var(--radius-md);border:1.5px solid transparent;cursor:pointer;transition:all var(--transition-fast);text-decoration:none;line-height:1.4;white-space:nowrap;user-select:none;height:38px;}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary);}
.btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);}

/* Settings card */
.settings-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-8);box-shadow:var(--shadow-xs);max-width:640px;}
.settings-section{margin-bottom:var(--space-8);}
.settings-section:last-child{margin-bottom:0;}
.settings-section h3{font-size:var(--text-base);font-weight:700;color:var(--color-text-primary);margin-bottom:var(--space-5);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-border-light);}
.settings-field{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--space-5);}
.settings-field label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);}
.settings-field input,.settings-field select{font-family:var(--font-sans);font-size:var(--text-sm);color:var(--color-text-primary);background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;outline:none;transition:all var(--transition-fast);width:100%;}
.settings-field input:hover,.settings-field select:hover{border-color:var(--color-border-hover);}
.settings-field input:focus,.settings-field select:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-ring);}
.settings-toggle{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;}
.settings-toggle input[type="checkbox"]{width:18px;height:18px;accent-color:var(--color-primary);cursor:pointer;margin:0;}
.settings-toggle label{font-size:var(--text-sm);color:var(--color-text-primary);cursor:pointer;user-select:none;}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,0.5);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal-box{background:var(--color-surface);border-radius:var(--radius-xl);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:modalEnter 250ms cubic-bezier(0.16,1,0.3,1);}
@keyframes modalEnter{from{opacity:0;transform:scale(0.95)translateY(12px)}to{opacity:1;transform:scale(1)translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:var(--space-6) var(--space-6) 0;}
.modal-head h2{font-size:var(--text-lg);font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--color-text-tertiary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:#F3F4F6;color:var(--color-text-primary);}
.modal-close svg{width:18px;height:18px;}
.modal-body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);}
.modal-body .field{display:flex;flex-direction:column;gap:5px;}
.modal-body .field label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);}
.modal-body .field label .req{color:var(--color-error);margin-left:2px;}
.modal-body .field input,.modal-body .field select{font-family:var(--font-sans);font-size:var(--text-sm);color:var(--color-text-primary);background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;outline:none;transition:all var(--transition-fast);width:100%;}
.modal-body .field input:focus,.modal-body .field select:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-ring);}
.modal-body .field input.error{border-color:var(--color-error);}
.modal-body .field .field-error{font-size:var(--text-xs);color:var(--color-error);font-weight:500;display:none;}
.modal-body .field .field-error.show{display:block;}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--space-3);padding:0 var(--space-6) var(--space-6);}

.modal-sm{max-width:400px;}

/* Toast */
/* AI Assistant */
.ai-btn{width:auto!important;padding:0 12px!important;gap:5px;background:linear-gradient(135deg,#3B82F6,#7C3AED)!important;color:#fff!important;border:none!important;box-shadow:0 2px 10px rgba(59,130,246,0.3)!important;position:relative;transition:all var(--transition-slow)!important;}
.ai-btn:hover{box-shadow:0 4px 16px rgba(59,130,246,0.45)!important;transform:scale(1.06);}
.ai-btn:active{transform:scale(0.95);}
.ai-btn svg{width:18px;height:18px;flex-shrink:0;}
.ai-btn-text{font-size:12px;font-weight:600;white-space:nowrap;}
.ai-btn .pulse{position:absolute;inset:-3px;border-radius:10px;border:2px solid rgba(59,130,246,0.25);animation:aiPulse 2.5s ease-in-out infinite;}
@keyframes aiPulse{0%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}

/* AI Chat Panel */
.ai-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ai-panel-overlay.show{opacity:1;pointer-events:auto;}
.ai-chat-panel{position:fixed;top:0;right:0;bottom:0;width:400px;background:#fff;z-index:1000;box-shadow:-4px 0 24px rgba(0,0,0,0.12);display:flex;flex-direction:row;transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);}
.ai-chat-panel.open{transform:translateX(0);}
.ai-history-btn{width:28px;flex-shrink:0;background:linear-gradient(180deg,#3B82F6,#7C3AED);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:width 0.2s;position:relative;z-index:2;border:none;border-radius:8px 0 0 8px;}
.ai-history-btn:hover{width:32px;}
.ai-history-btn svg{width:16px;height:16px;}
.ai-history-sidebar{position:absolute;left:28px;top:0;bottom:0;width:0;overflow:hidden;background:#FFFFFF;border-right:1px solid #E5E7EB;transition:width 0.3s cubic-bezier(0.16,1,0.3,1);z-index:1;}
.ai-history-sidebar.open{width:260px;}
.ai-history-sidebar-inner{width:260px;height:100%;display:flex;flex-direction:column;}
.ai-history-top{padding:14px 14px 10px;}
.ai-new-chat-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px solid #E5E7EB;background:#FFFFFF;border-radius:10px;color:#0F172A;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit;}
.ai-new-chat-btn:hover{background:#F9FAFB;border-color:#CBD5E1;}
.ai-new-chat-btn svg{width:16px;height:16px;color:#6B7280;}
.ai-history-list{flex:1;overflow-y:auto;padding:8px 10px;}
.ai-history-group-title{font-size:11px;font-weight:600;color:#9CA3AF;padding:10px 12px 6px;letter-spacing:0.02em;}
.ai-history-item{position:relative;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:#374151;margin-bottom:2px;transition:background 0.15s;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ai-history-item:hover{background:#F1F5F9;}
.ai-history-item.active{background:#EFF6FF;color:#1D4ED8;font-weight:600;}
.ai-history-item .h-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ai-history-item .h-actions{opacity:0;display:flex;gap:2px;transition:opacity 0.15s;}
.ai-history-item:hover .h-actions{opacity:1;}
.ai-history-item .h-actions button{width:22px;height:22px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:#6B7280;display:flex;align-items:center;justify-content:center;}
.ai-history-item .h-actions button:hover{background:#E5E7EB;color:#0F172A;}
.ai-history-item .h-actions svg{width:14px;height:14px;}
.ai-history-item .pinned{color:#F59E0B;}
.ai-history-item .pinned svg{width:12px;height:12px;}
.ai-history-empty{padding:24px 16px;text-align:center;font-size:13px;color:#9CA3AF;}
.ai-chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.ai-chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #E5E7EB;flex-shrink:0;}
.ai-chat-header .ai-title{font-size:15px;font-weight:700;color:#1F2937;flex:1;display:flex;align-items:center;gap:8px;}
.ai-chat-header .ai-title svg{width:22px;height:22px;flex-shrink:0;}
.ai-chat-header .ai-chat-badge{font-size:10px;font-weight:600;color:#7C3AED;background:#F5F3FF;padding:2px 10px;border-radius:10px;}
.ai-chat-header .modal-close{width:32px;height:32px;border:none;background:transparent;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6B7280;}
.ai-chat-header .modal-close:hover{background:#F3F4F6;color:#111827;}
.ai-chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#F9FAFB;}
.ai-msg-row{display:flex;gap:10px;max-width:85%;animation:msgIn 0.3s ease-out;}
.ai-msg-ai{align-self:flex-start;}
.ai-msg-user{align-self:flex-end;flex-direction:row-reverse;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ai-msg-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;}
.ai-msg-user .ai-msg-icon{background:linear-gradient(135deg,#6366F1,#8B5CF6);}
.ai-msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;position:relative;}
.ai-msg-ai .ai-msg-bubble{background:#fff;border:1px solid #E5E7EB;color:#374151;border-bottom-left-radius:4px;}
.ai-msg-user .ai-msg-bubble{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;border-bottom-right-radius:4px;}
.ai-msg-ai .ai-msg-sender{font-size:11px;font-weight:600;color:#6B7280;margin-bottom:4px;}
.ai-chat-input-area{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #E5E7EB;background:#fff;flex-shrink:0;}
.ai-chat-input-area input{flex:1;height:40px;border:1.5px solid #E5E7EB;border-radius:20px;padding:0 16px;font-size:14px;outline:none;transition:border-color 0.2s;font-family:inherit;}
.ai-chat-input-area input:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.ai-chat-input-area input::placeholder{color:#9CA3AF;}
.ai-send-btn{width:40px;height:40px;border:none;background:linear-gradient(135deg,#3B82F6,#7C3AED);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.ai-send-btn:hover{transform:scale(1.08);box-shadow:0 2px 8px rgba(59,130,246,0.35);}
.ai-send-btn:active{transform:scale(0.95);}
.ai-send-btn svg{width:18px;height:18px;}

.toast{position:fixed;bottom:24px;right:24px;display:flex;align-items:center;gap:10px;padding:12px 20px;background:#111827;color:var(--color-text-inverse);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;box-shadow:var(--shadow-lg);z-index:300;transform:translateY(80px);opacity:0;transition:all 300ms cubic-bezier(0.16,1,0.3,1);pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.toast svg{width:18px;height:18px;flex-shrink:0;}
.toast.success svg{color:#34D399;}
.toast.error svg{color:#F87171;}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-delay:0ms!important;transition-duration:0.01ms!important;}.modal-box{animation:none}}
@media (max-width:1024px){}
@media (max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .topbar{padding:0 var(--space-4);}
  .page{padding:var(--space-4);}
}
@media (max-width:480px){
  .page-title-area h1{font-size:var(--text-lg);}
}
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="sidebar-brand">大健康CRM<span>.</span></div>
      <div class="sidebar-version">v1.0</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">

<script>
// ===================== Auth Check =====================
(function(){var u=localStorage.getItem('crm_current_user');if(!u){window.location.href='login.html';return;}try{var S=JSON.parse(u);if(S&&S.role){try{var R=JSON.parse(localStorage.getItem('crm_roles'));if(R){var r=R.find(function(x){return x.name===S.role;});if(r){S.permissions=r.permissions||[];S.roleId=r.id;localStorage.setItem('crm_current_user',JSON.stringify(S));}}}catch(e){}}}catch(e){window.location.href='login.html';}})();
function getUserSession(){try{return JSON.parse(localStorage.getItem('crm_current_user'))}catch(e){}return null;}
function openUserCenter(){var u=getUserSession();if(!u)return;document.getElementById('ucName').value=u.name||'';document.getElementById('ucPhone').value=u.phone||'';document.getElementById('userCenterModal').classList.add('open');document.body.style.overflow='hidden';}
function closeUserCenter(){document.getElementById('userCenterModal').classList.remove('open');document.body.style.overflow='';}
(function(){var el=document.getElementById('userCenterModal');if(el)el.addEventListener('click',function(e){if(e.target.id==='userCenterModal')closeUserCenter();});})();
function openChangePwd(){document.getElementById('pwdOld').value='';document.getElementById('pwdNew').value='';document.getElementById('pwdConfirm').value='';['pwdOldError','pwdNewError','pwdConfirmError'].forEach(function(i){var e=document.getElementById(i);if(e)e.classList.remove('show');});['pwdOld','pwdNew','pwdConfirm'].forEach(function(i){var e=document.getElementById(i);if(e)e.classList.remove('error');});document.getElementById('changePwdModal').classList.add('open');document.body.style.overflow='hidden';setTimeout(function(){var e=document.getElementById('pwdOld');if(e)e.focus();},100);}
function closeChangePwd(){document.getElementById('changePwdModal').classList.remove('open');document.body.style.overflow='';}
(function(){var el=document.getElementById('changePwdModal');if(el)el.addEventListener('click',function(e){if(e.target.id==='changePwdModal')closeChangePwd();});})();
function submitChangePwd(){var op=document.getElementById('pwdOld').value,np=document.getElementById('pwdNew').value,cp=document.getElementById('pwdConfirm').value,ok=true,u=getUserSession();if(!u)return;var acts=[];try{var r=localStorage.getItem('crm_accounts');if(r)acts=JSON.parse(r);}catch(e){}var ac=acts.find(function(a){return a.phone===u.phone;});if(!ac||ac.password!==op){document.getElementById('pwdOldError').classList.add('show');document.getElementById('pwdOld').classList.add('error');ok=false;}else{document.getElementById('pwdOldError').classList.remove('show');document.getElementById('pwdOld').classList.remove('error');}if(!np){document.getElementById('pwdNewError').classList.add('show');document.getElementById('pwdNew').classList.add('error');ok=false;}else{document.getElementById('pwdNewError').classList.remove('show');document.getElementById('pwdNew').classList.remove('error');}if(np!==cp){document.getElementById('pwdConfirmError').classList.add('show');document.getElementById('pwdConfirm').classList.add('error');ok=false;}else if(np){document.getElementById('pwdConfirmError').classList.remove('show');document.getElementById('pwdConfirm').classList.remove('error');}if(!ok)return;if(ac)ac.password=np;try{localStorage.setItem('crm_accounts',JSON.stringify(acts));}catch(e){}closeChangePwd();toast('密码修改成功','success');}
function userLogout(){if(confirm('确认退出登录？')){localStorage.removeItem('crm_current_user');localStorage.removeItem('crm_current_user_name');window.location.href='login.html';}}
function userLogout(){if(confirm('确认退出登录？')){localStorage.removeItem('crm_current_user');localStorage.removeItem('crm_current_user_name');window.location.href='login.html';}}
// ===================== AI Chat Panel =====================
var aiChatHistory=[];var aiMsgId=0;var chatSessions=[];
function loadChatHistory(){try{var h=localStorage.getItem('crm_ai_chat_history');if(h)aiChatHistory=JSON.parse(h);}catch(e){}aiChatHistory=aiChatHistory||[];}
function saveChatHistory(){try{localStorage.setItem('crm_ai_chat_history',JSON.stringify(aiChatHistory.slice(-50)));}catch(e){}}
function loadSessions(){try{var s=localStorage.getItem('crm_ai_sessions');if(s)chatSessions=JSON.parse(s);}catch(e){}chatSessions=chatSessions||[];}
function saveSessions(){try{localStorage.setItem('crm_ai_sessions',JSON.stringify(chatSessions.slice(-20)));}catch(e){}}
loadChatHistory();loadSessions();
function addMsg(text,role){var m={id:++aiMsgId,text:text,role:role,time:new Date().toLocaleTimeString()};aiChatHistory.push(m);saveChatHistory();return m;}
function renderHistoryList(){var el=document.getElementById('aiHistoryList');if(!el)return;var html='';var allSessions=chatSessions.slice().reverse();if(allSessions.length>0){var groups={pinned:[],today:[],yesterday:[],week:[],month:[],earlier:[]};allSessions.forEach(function(s){if(s.pinned){groups.pinned.push(s);return;}var d=new Date(s.id.replace('session_',''));var now=new Date();var diff=(now-d)/86400000;if(diff<1)groups.today.push(s);else if(diff<2)groups.yesterday.push(s);else if(diff<7)groups.week.push(s);else if(diff<30)groups.month.push(s);else groups.earlier.push(s);});function renderGroup(name,arr){if(arr.length===0)return '';var h='<div class="ai-history-group-title">'+name+'</div>';arr.forEach(function(s){var first=s.msgs.find(function(m){return m.role==='我';});var title=first?first.text.substring(0,25)+(first.text.length>25?'...':''):'新会话';h+='<div class="ai-history-item'+(s.pinned?' pinned':'')+'" onclick="restoreSession(\''+s.id+'\')"><div class="h-text">'+(s.pinned?'<svg class="pinned" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg> ':'')+title+'</div><div class="h-actions"><button onclick="event.stopPropagation();pinSession(\''+s.id+'\')" title="'+(s.pinned?'取消置顶':'置顶')+'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg></button><button onclick="event.stopPropagation();renameSession(\''+s.id+'\')" title="重命名"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button onclick="event.stopPropagation();deleteSession(\''+s.id+'\')" title="删除" style="color:#EF4444;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div>';});return h;}
html+=renderGroup('置顶',groups.pinned);
html+=renderGroup('今天',groups.today);
html+=renderGroup('昨天',groups.yesterday);
html+=renderGroup('7天内',groups.week);
html+=renderGroup('30天内',groups.month);
html+=renderGroup('更早',groups.earlier);
}
if(!html)html='<div class="ai-history-empty">开始对话后会自动保存</div>';el.innerHTML=html;}
function restoreSession(sid){var s=chatSessions.find(function(x){return x.id===sid;});if(!s)return;if(confirm('切换后将清除当前对话，是否继续？')){aiChatHistory=JSON.parse(JSON.stringify(s.msgs));aiMsgId=Math.max.apply(null,aiChatHistory.map(function(x){return x.id;}))+1;saveChatHistory();var msgs=document.getElementById('aiChatMessages');if(msgs)msgs.innerHTML='';aiChatHistory.forEach(function(m){appendMsgBubble(m);});renderHistoryList();var hs=document.getElementById('aiHistorySidebar');if(hs)hs.classList.remove('open');}}
function pinSession(sid){var s=chatSessions.find(function(x){return x.id===sid;});if(!s)return;s.pinned=!s.pinned;saveSessions();renderHistoryList();}
function renameSession(sid){var s=chatSessions.find(function(x){return x.id===sid;});if(!s)return;var first=s.msgs.find(function(m){return m.role==='我';});var current=first?first.text.substring(0,25):'新会话';var newName=prompt('修改会话标题：',current);if(newName&&newName.trim()){var newFirst=s.msgs.find(function(m){return m.role==='我';});if(newFirst)newFirst.text=newName.trim();saveSessions();renderHistoryList();}}
function deleteSession(sid){if(!confirm('确认删除此会话？此操作不可撤销。'))return;chatSessions=chatSessions.filter(function(x){return x.id!==sid;});saveSessions();renderHistoryList();}
function openAIChat(){document.getElementById('aiChatPanel').classList.add('open');document.getElementById('aiPanelOverlay').classList.add('show');document.body.style.overflow='hidden';
var msgs=document.getElementById('aiChatMessages');msgs.innerHTML='';var greeted=aiChatHistory.some(function(m){return m.role==='AI'&&m.text==='今天有什么可以帮助你？';});
if(!greeted){addMsg('今天有什么可以帮助你？','AI');}
aiChatHistory.forEach(function(m){if(m.text==='今天有什么可以帮助你？'&&m.role==='AI')appendMsgBubble(m);else appendMsgBubble(m);});
renderHistoryList();setTimeout(function(){var inp=document.getElementById('aiChatInput');if(inp)inp.focus();},300);}
function linkify(t){var s=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:#2563EB;text-decoration:underline;">$1</a>').replace(/(?<!href=")(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:#2563EB;text-decoration:underline;">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#1E40AF;">$1</strong>').replace(/^### (.+)$/gm,'<div style="margin:8px 0 4px;font-size:13px;font-weight:700;color:#1E40AF;border-bottom:1px solid #DBEAFE;padding-bottom:4px;">$1</div>').replace(/^## (.+)$/gm,'<div style="margin:10px 0 4px;font-size:14px;font-weight:700;color:#0F172A;">$1</div>').replace(/\n/g,'<br>');return s;}
function appendMsgBubble(m){var el=document.getElementById('aiChatMessages');if(!el)return;var row=document.createElement('div');row.className='ai-msg-row '+(m.role==='AI'?'ai-msg-ai':'ai-msg-user');
if(m.role==='AI'){row.innerHTML='<div class="ai-msg-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M12 6v2"/><path d="M12 16v2"/><path d="M6 12h2"/><path d="M16 12h2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="9" y1="15" x2="15" y2="9"/></svg></div><div class="ai-msg-bubble"><div class="ai-msg-sender">AI助手</div><div class="ai-msg-text">'+linkify(m.text)+'</div></div>';}
else{row.innerHTML='<div class="ai-msg-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="ai-msg-bubble">'+linkify(m.text)+'</div></div>';}
el.appendChild(row);el.scrollTop=el.scrollHeight;}
function newChat(){if(confirm('将当前对话保存到历史记录并开始新会话？')){if(aiChatHistory.length>1&&aiChatHistory.some(function(m){return m.role==='我';})){var sid='session_'+Date.now();var first=aiChatHistory.find(function(m){return m.role==='我';});chatSessions.push({id:sid,msgs:JSON.parse(JSON.stringify(aiChatHistory)),time:new Date().toLocaleString(),title:first?first.text.substring(0,25):'新会话'});saveSessions();}aiChatHistory=[];aiMsgId=0;saveChatHistory();var msgs=document.getElementById('aiChatMessages');if(msgs)msgs.innerHTML='';addMsg('今天有什么可以帮助你？','AI');appendMsgBubble(aiChatHistory[aiChatHistory.length-1]);renderHistoryList();}}

function sendChatMsg(){var inp=document.getElementById('aiChatInput');if(!inp)return;var t=inp.value.trim();if(!t)return;inp.value='';addMsg(t,'我');
var msgs=document.getElementById('aiChatMessages');var row=document.createElement('div');row.className='ai-msg-row ai-msg-user';
row.innerHTML='<div class="ai-msg-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="ai-msg-bubble">'+t+'</div></div>';
msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;renderHistoryList();
// 调用真实 AI 后端
addMsg('思考中...','AI');appendMsgBubble(aiChatHistory[aiChatHistory.length-1]);renderHistoryList();
var lastBubble=document.querySelector('#aiChatMessages .ai-msg-row:last-child .ai-msg-text');
if(lastBubble)lastBubble.style.color='#9CA3AF';
fetch('http://localhost:3000/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:aiChatHistory.slice(-10,-1)})}).then(function(r){var reader=r.body.getReader();var decoder=new TextDecoder();var buffer='';var reply='';function read(){reader.read().then(function(r2){if(r2.done){if(reply){aiChatHistory[aiChatHistory.length-1].text=reply;saveChatHistory();if(lastBubble){lastBubble.style.color='';lastBubble.innerHTML=linkify(reply);}}return;}buffer+=decoder.decode(r2.value,{stream:true});var lines=buffer.split('\n');buffer=lines.pop()||'';
lines.forEach(function(l){l=l.trim();if(l.startsWith('data: ')){try{var d=JSON.parse(l.slice(6));if(d.content){reply+=d.content;if(lastBubble){lastBubble.style.color='';lastBubble.textContent=reply;}msgs.scrollTop=msgs.scrollHeight;}}catch(e){}}});read();});}read();}).catch(function(e){if(lastBubble){lastBubble.style.color='#EF4444';lastBubble.textContent='连接失败，请确认 AI 服务器已启动（端口 3001）';}});}
function closeAIChat(){document.getElementById('aiChatPanel').classList.remove('open');document.getElementById('aiPanelOverlay').classList.remove('show');document.body.style.overflow='';var hs=document.getElementById('aiHistorySidebar');if(hs)hs.classList.remove('open');}
function toggleHistory(){var hs=document.getElementById('aiHistorySidebar');if(hs){hs.classList.toggle('open');renderHistoryList();}}
function restoreChat(id){var m=aiChatHistory.find(function(x){return x.id===id;});if(!m)return;var inp=document.getElementById('aiChatInput');if(inp)inp.value=m.text.substring(0,20);var hs=document.getElementById('aiHistorySidebar');if(hs)hs.classList.remove('open');setTimeout(function(){var i=document.getElementById('aiChatInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);}
(function(){var btn=document.getElementById('aiBtn');var panel=document.getElementById('aiChatPanel');var overlay=document.getElementById('aiPanelOverlay');if(btn)btn.addEventListener('click',openAIChat);if(overlay)overlay.addEventListener('click',closeAIChat);var inp=document.getElementById('aiChatInput');var sendBtn=document.getElementById('aiSendBtn');if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMsg();}});if(sendBtn)sendBtn.addEventListener('click',sendChatMsg);})();
// ===================== Load User Info =====================
(function(){try{var u=JSON.parse(localStorage.getItem('crm_current_user'));if(u&&u.name){var e=document.getElementById('navUserName');if(e)e.textContent=u.name;var a=document.getElementById('navAvatar');if(a)a.textContent=u.name.charAt(0);var r=document.getElementById('navUserRole');if(r)r.textContent=u.role||'用户';if(u.permissions && u.permissions.length>0){document.querySelectorAll('.nav-item').forEach(function(n){var m=n.getAttribute('data-menu');if(!m||m==='role'||m==='account')return;var ok=u.permissions.some(function(p){return p.pageId===m;});if(!ok)n.style.display='none';});}}}catch(e){}})();

function toast(msg, type) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.className = 'toast ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
