<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据仪表盘 — 大健康 CRM v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary:#2563EB; --color-primary-hover:#1D4ED8; --color-primary-light:#EFF6FF; --color-primary-ring:rgba(37,99,235,0.25);
  --color-success:#10B981; --color-success-bg:#ECFDF5; --color-success-text:#047857;
  --color-warning:#F59E0B; --color-warning-bg:#FFFBEB; --color-warning-text:#B45309;
  --color-error:#EF4444; --color-error-bg:#FEF2F2; --color-error-text:#B91C1C;
  --color-bg:#F9FAFB; --color-surface:#FFFFFF; --color-bg-card:#F8FAFC;
  --color-text-primary:#111827; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF; --color-text-inverse:#FFFFFF;
  --color-border:#E5E7EB; --color-border-hover:#D1D5DB; --color-border-light:#F3F4F6;
  --sidebar-width:264px; --header-height:64px;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --shadow-xs:0 1px 2px rgba(16,24,40,0.04);
  --shadow-sm:0 1px 3px rgba(16,24,40,0.06),0 1px 2px rgba(16,24,40,0.04);
  --shadow-md:0 4px 8px -2px rgba(16,24,40,0.06),0 2px 4px -2px rgba(16,24,40,0.04);
  --shadow-lg:0 12px 16px -4px rgba(16,24,40,0.08),0 4px 6px -2px rgba(16,24,40,0.04);
  --shadow-xl:0 20px 24px -4px rgba(16,24,40,0.10),0 8px 8px -4px rgba(16,24,40,0.04);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --text-xs:0.75rem; --text-sm:0.8125rem; --text-base:0.9375rem; --text-lg:1.125rem; --text-xl:1.375rem; --text-2xl:1.75rem;
  --transition-fast:150ms cubic-bezier(0.4,0,0.2,1);
  --transition-base:200ms cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-bg);line-height:1.6;min-height:100vh;}
.app{display:flex;min-height:100vh;}

.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#0B1B3D 0%,#0F1E3F 50%,#0A1530 100%);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;color:#E2E8F0;}
.sidebar-header{padding:var(--space-5) var(--space-5) var(--space-4);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:var(--space-3);min-height:var(--header-height);}
.sidebar-logo{width:36px;height:36px;border-radius:var(--radius-md);background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 0 16px rgba(59,130,246,0.4);}
.sidebar-logo svg{width:20px;height:20px;}
.sidebar-brand{font-size:var(--text-lg);font-weight:700;color:#FFFFFF;letter-spacing:-0.025em;}
.sidebar-brand span{color:#60A5FA;}
.sidebar-version{margin-left:auto;font-size:10px;font-weight:600;color:#93C5FD;background:rgba(96,165,250,0.12);padding:2px 8px;border-radius:4px;}
.sidebar-nav{flex:1;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);overflow-y:auto;}
.sidebar-section-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.12em;padding:var(--space-4) var(--space-3) var(--space-2);}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-3);border-radius:var(--radius-md);color:rgba(255,255,255,0.7);text-decoration:none;font-size:var(--text-sm);font-weight:500;cursor:pointer;transition:all var(--transition-fast);position:relative;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#FFFFFF;}
.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,0.18) 0%,rgba(96,165,250,0.06) 100%);color:#FFFFFF;font-weight:600;}
.nav-item.active .nav-icon{color:#60A5FA;}
.nav-item .nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);}
.nav-item .nav-icon svg{width:20px;height:20px;}
.nav-item .nav-label{flex:1;}
.nav-item .nav-count{font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.08);padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;}
.nav-item.active .nav-count{background:rgba(96,165,250,0.2);color:#93C5FD;}
.nav-item .nav-indicator{position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);width:3px;height:20px;background:#60A5FA;border-radius:0 3px 3px 0;transition:transform var(--transition-base);box-shadow:0 0 8px #60A5FA;}
.nav-item.active .nav-indicator{transform:translateY(-50%) scaleY(1);}
.sidebar-footer{padding:var(--space-3);border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-user{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);cursor:pointer;}
.sidebar-user:hover{background:rgba(255,255,255,0.06);}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--text-xs);font-weight:600;flex-shrink:0;}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-name{font-size:var(--text-sm);font-weight:600;color:#FFFFFF;}
.sidebar-user-role{font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);}
.sidebar-user svg{width:16px;height:16px;color:rgba(255,255,255,0.5);}

.main{flex:1;margin-left:var(--sidebar-width);min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--color-surface);border-bottom:1px solid var(--color-border);height:var(--header-height);padding:0 var(--space-8);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:var(--space-4);}
.page-title-area{display:flex;align-items:center;gap:var(--space-3);}
.page-title-area h1{font-size:var(--text-xl);font-weight:700;color:var(--color-text-primary);letter-spacing:-0.02em;}
.page-title-badge{font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);background:#F3F4F6;padding:2px 10px;border-radius:12px;}
.topbar-right{display:flex;align-items:center;gap:var(--space-2);}
.topbar-btn{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.topbar-btn:hover{background:#F9FAFB;color:var(--color-text-primary);}
.topbar-btn svg{width:18px;height:18px;}
.topbar-btn .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;background:var(--color-error);border-radius:50%;border:1.5px solid var(--color-surface);}
.topbar-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary) 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;color:var(--color-text-inverse);font-size:var(--text-sm);font-weight:600;cursor:pointer;flex-shrink:0;margin-left:var(--space-1);}

.page{padding:var(--space-6) var(--space-8) var(--space-8);flex:1;}

/* === Metric Cards Row === */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5);margin-bottom:var(--space-6);}
.metric-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);box-shadow:var(--shadow-xs);transition:all var(--transition-fast);}
.metric-card:hover{box-shadow:var(--shadow-md);border-color:var(--color-border-hover);}
.metric-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-3);}
.metric-label{font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);}
.metric-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.metric-icon svg{width:20px;height:20px;}
.metric-value{font-size:var(--text-2xl);font-weight:800;color:var(--color-text-primary);letter-spacing:-0.03em;line-height:1.2;}
.metric-sub{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1);}
.metric-change{font-size:var(--text-xs);font-weight:600;padding:1px 8px;border-radius:12px;}
.metric-change.up{background:var(--color-success-bg);color:var(--color-success-text);}
.metric-change.down{background:var(--color-error-bg);color:var(--color-error-text);}
.metric-desc{font-size:var(--text-xs);color:var(--color-text-tertiary);}
.metric-target{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2);}
.metric-target-bar{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden;}
.metric-target-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(0.16,1,0.3,1);}
.metric-target-label{font-size:var(--text-xs);font-weight:600;color:var(--color-text-secondary);white-space:nowrap;}

/* === Dashboard Cards === */
.dash-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-xs);}
.dash-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6);}
.dash-card-title{font-size:var(--text-base);font-weight:700;color:var(--color-text-primary);}
.dash-card-extra{display:flex;align-items:center;gap:var(--space-2);}

/* === Tabs === */
.tab-bar{display:flex;gap:2px;background:#F3F4F6;padding:3px;border-radius:var(--radius-md);}
.tab-btn{padding:5px 14px;border:none;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:var(--text-xs);font-weight:600;color:var(--color-text-secondary);background:transparent;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;}
.tab-btn:hover{color:var(--color-text-primary);}
.tab-btn.active{background:var(--color-surface);color:var(--color-primary);box-shadow:var(--shadow-sm);}

/* === Grid Layout === */
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-top:var(--space-5);}
.dash-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-5);margin-top:var(--space-5);}
.dash-grid-full{margin-top:var(--space-5);}

/* === SVG Charts Container === */
.chart-wrap{width:100%;position:relative;}
.chart-wrap svg{width:100%;height:auto;display:block;}

/* === Funnel === */
.funnel{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2) 0;}
.funnel-row{display:flex;align-items:center;gap:var(--space-4);}
.funnel-label{width:80px;font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary);text-align:right;flex-shrink:0;}
.funnel-bar-wrap{flex:1;display:flex;align-items:center;justify-content:center;height:44px;position:relative;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--color-primary) 0%,#7C3AED 100%);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:width 1s cubic-bezier(0.16,1,0.3,1);min-width:20px;}
.funnel-bar-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.funnel-count{font-size:var(--text-sm);font-weight:700;color:var(--color-text-inverse);text-shadow:0 1px 2px rgba(0,0,0,0.15);}

/* === Ranking === */
.rank-list{display:flex;flex-direction:column;gap:var(--space-2);}
.rank-item{display:flex;align-items:center;gap:var(--space-3);}
.rank-num{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--color-text-secondary);background:#F3F4F6;flex-shrink:0;}
.rank-num.gold{background:#F59E0B;color:#fff;}
.rank-num.silver{background:#9CA3AF;color:#fff;}
.rank-num.bronze{background:#D97706;color:#fff;}
.rank-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:var(--text-sm);font-weight:600;color:var(--color-text-primary);}
.rank-label{font-size:11px;color:var(--color-text-tertiary);}
.rank-value{font-size:var(--text-sm);font-weight:700;color:#059669;flex-shrink:0;}
.rank-bar-bg{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden;max-width:100px;}
.rank-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(0.16,1,0.3,1);}

/* === Pie Legend === */
.pie-container{display:flex;align-items:center;gap:var(--space-6);}
.pie-svg-wrap{flex-shrink:0;}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:var(--space-2);}
.legend-item{display:flex;align-items:center;gap:var(--space-3);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-label{font-size:var(--text-sm);color:var(--color-text-primary);flex:1;}
.legend-value{font-size:var(--text-sm);font-weight:700;color:var(--color-text-secondary);}

/* === Source Bar Chart === */
.source-bar{display:flex;flex-direction:column;gap:var(--space-3);}
.source-row{display:flex;align-items:center;gap:var(--space-3);}
.source-label{width:80px;font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary);text-align:right;flex-shrink:0;}
.source-bar-bg{flex:1;height:22px;background:#F3F4F6;border-radius:4px;overflow:hidden;}
.source-bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;transition:width 1s cubic-bezier(0.16,1,0.3,1);min-width:30px;}
.source-bar-count{font-size:var(--text-xs);font-weight:700;color:var(--color-text-inverse);white-space:nowrap;}

/* === Conversions Tab === */
.conversion-tabs{display:flex;gap:var(--space-2);margin-top:var(--space-3);}
.conv-tab{flex:1;text-align:center;padding:var(--space-3);border-radius:var(--radius-md);border:1px solid var(--color-border);cursor:pointer;transition:all var(--transition-fast);background:var(--color-surface);}
.conv-tab.active{border-color:var(--color-primary);background:var(--color-primary-light);}
.conv-tab:hover{border-color:var(--color-primary);}
.conv-tab-value{font-size:var(--text-lg);font-weight:800;color:var(--color-primary);}
.conv-tab-label{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:2px;}

@media (max-width:1200px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .dash-grid-2{grid-template-columns:1fr;}
  .dash-grid-3{grid-template-columns:1fr;}
  .pie-container{flex-direction:column;}
}
@media (max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .topbar{padding:0 var(--space-4);}
  .page{padding:var(--space-4);}
  .metrics{grid-template-columns:1fr;}
  .funnel-row{flex-direction:column;align-items:flex-start;gap:var(--space-1);}
  .funnel-label{width:100%;text-align:left;}
}
</style>
</head>

// ===================== Auth Check =====================

// ===================== SVG Chart Generators =====================
function generateLineChart(data, color, width, height) {
  const pad = {t:24,r:16,b:32,l:40};
  const cw = width-pad.l-pad.r;
  const ch = height-pad.t-pad.b;
  const max = Math.max(...data)*1.12;
  const stepX = cw/(data.length-1);
  const points = data.map((v,i)=>`${pad.l+i*stepX},${pad.t+ch-(v/max)*ch}`).join(' ');
  const polyline = `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const fillPoly = data.map((v,i)=>`${pad.l+i*stepX},${pad.t+ch-(v/max)*ch}`).join(' ')+` ${pad.l+(data.length-1)*stepX},${pad.t+ch} ${pad.l},${pad.t+ch}`;
  const area = `<polygon points="${fillPoly}" fill="url(#${color.slice(1)}Grad)" opacity="0.12"/>`;
  const gradId = color.slice(1)+'Grad';
  const gradient = `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.4"/><stop offset="100%" stop-color="${color}" stop-opacity="0.01"/></linearGradient></defs>`;
  // Grid lines: 4 horizontal
  let grid = '';
  for(let i=0;i<=4;i++) {
    const y = pad.t+ch*(i/4);
    const val = Math.round(max*(1-i/4));
    grid += `<line x1="${pad.l}" y1="${y}" x2="${width-pad.r}" y2="${y}" stroke="#F3F4F6" stroke-width="1"/>`;
    grid += `<text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9CA3AF" font-family="'Plus Jakarta Sans',sans-serif">${val>=1000?(val/1000).toFixed(1)+'k':val}</text>`;
  }
  // X labels: show every other one if too many
  const labelStep = data.length>10 ? Math.ceil(data.length/8) : 1;
  let labels = '';
  for(let i=0;i<data.length;i+=labelStep) {
    const x = pad.l+i*stepX;
    const idx = DAY_LABELS.length-data.length+i;
    if(idx>=0) labels += `<text x="${x}" y="${pad.t+ch+16}" text-anchor="middle" font-size="9" fill="#9CA3AF" font-family="'Plus Jakarta Sans',sans-serif">${DAY_LABELS[idx]}</text>`;
  }
  // Dot markers
  let dots = '';
  data.forEach((v,i)=>{
    const x=pad.l+i*stepX, y=pad.t+ch-(v/max)*ch;
    dots += `<circle cx="${x}" cy="${y}" r="3" fill="${color}" stroke="#fff" stroke-width="2" opacity="0"/><circle cx="${x}" cy="${y}" r="3.5" fill="${color}" opacity="0" class="dot-${gradId}"/>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="max-height:${height}px">
    ${gradient}${grid}${area}${polyline}${dots}
    <style>.dot-${gradId}:hover{opacity:1!important;r:5!important;}.dot-${gradId}{opacity:0.8;transition:opacity 0.2s;}</style>
  </svg>`;
}

          <div class="metric-label">${monthLabel} 销售额</div>
          <div class="metric-icon" style="background:#ECFDF5;color:#059669;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        </div>
        <div class="metric-value">¥${(thisMonthSales/10000).toFixed(2)}万</div>
        <div class="metric-sub"><span class="metric-change up">↑ 12.5%</span><span class="metric-desc">较上月</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-label">${monthLabel} 客户线索</div>
          <div class="metric-icon" style="background:#EFF6FF;color:#2563EB;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        </div>
        <div class="metric-value">${thisMonthLeads}</div>
        <div class="metric-sub"><span class="metric-change up">↑ 8.3%</span><span class="metric-desc">较上月</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-label">${monthLabel} 订单数</div>
          <div class="metric-icon" style="background:#FEF3C7;color:#D97706;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
        </div>
        <div class="metric-value">${thisMonthOrders}</div>
        <div class="metric-sub"><span class="metric-change up">↑ 15.2%</span><span class="metric-desc">较上月</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-top">
          <div class="metric-label">${monthLabel} 业绩达成</div>
          <div class="metric-icon" style="background:#F0FDF4;color:#059669;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
        </div>
        <div class="metric-value">${pct}%</div>
        <div class="metric-target">
          <div class="metric-target-bar"><div class="metric-target-fill" style="width:${pct}%;background:linear-gradient(90deg,#2563EB,#7C3AED);"></div></div>
          <div class="metric-target-label">¥${(thisMonthSales/10000).toFixed(2)}万 / ¥${(targetAmt/10000).toFixed(1)}万</div>
        </div>
      </div>
    </div>

    <!-- 二、业绩趋势图 + tab切换 -->
    <div class="dash-card dash-grid-full">
      <div class="dash-card-header">
        <div class="dash-card-title">业绩趋势</div>
        <div class="dash-card-extra"><div class="tab-bar" id="trendTabs"><button class="tab-btn active" data-trend="sales">销售额</button><button class="tab-btn" data-trend="leads">线索数</button><button class="tab-btn" data-trend="orders">订单数</button></div></div>
      </div>
      <div class="chart-wrap" id="trendChartWrap">${generateLineChart(trendData.sales, CHART_COLORS.sales, 680, 220)}</div>
    </div>

    <!-- 三 + 四 + 五：线索来源、转化漏斗、销售排行 -->
    <div class="dash-grid-3">
      <div class="dash-card">
        <div class="dash-card-header"><div class="dash-card-title">线索来源排行榜</div></div>
        <div class="source-bar">
          ${sourceData.map((s,i)=>`
            <div class="source-row">
              <div class="source-label">${s.name}</div>
              <div class="source-bar-bg"><div class="source-bar-fill" style="width:${(s.count/sourceData[0].count*100).toFixed(0)}%;background:${SOURCE_COLORS[i]};"><span class="source-bar-count">${s.count}</span></div></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="dash-card">
        <div class="dash-card-header"><div class="dash-card-title">客户转化漏斗</div></div>
        <div class="funnel">
          ${funnelData.map(f=>`
            <div class="funnel-row">
              <div class="funnel-label">${f.stage}</div>
              <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${(f.count/funnelData[0].count*100).toFixed(0)}%;"><span class="funnel-count">${f.count}</span></div></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="dash-card">
        <div class="dash-card-header"><div class="dash-card-title">售卖商品统计</div></div>
        <div class="pie-container">
          <div class="pie-svg-wrap">${generatePieChart()}</div>
          <div class="pie-legend">
            ${productSales.slice(0,6).map((p,i)=>`
              <div class="legend-item"><span class="legend-dot" style="background:${PIE_COLORS[i]}"></span><span class="legend-label">${p.name}</span><span class="legend-value">${(p.amount/totalAmount*100).toFixed(1)}%</span></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- 六：销售排行 -->
    <div class="dash-grid-full">
      <div class="dash-card">
        <div class="dash-card-header">
          <div class="dash-card-title">销售人员业绩排行</div>
          <div class="dash-card-extra"><div class="tab-bar" id="rankTabs"><button class="tab-btn active" data-rank="sales">销售额 TOP10</button><button class="tab-btn" data-rank="conv">转化率 TOP10</button></div></div>
        </div>
        <div class="rank-list" id="rankListWrap">
          ${renderRankList('sales')}
        </div>
      </div>
    </div>`;
}

function generatePieChart() {
  const cx=90, cy=90, r=76, total=productSales.reduce((s,p)=>s+p.amount,0);
  let paths = '', startAngle = -90;
  const top6 = productSales.slice(0,6);
  const others = productSales.slice(6).reduce((s,p)=>s+p.amount,0);
  if (others>0) top6.push({name:'其他', amount: others});
  const segments = top6;
  const colors = PIE_COLORS.slice();
  if (others>0) colors[6]='#9CA3AF';
  segments.forEach((p,i)=>{
    const angle = (p.amount/total)*360;
    const endAngle = startAngle+angle;
    const sr = (startAngle*Math.PI)/180, er = (endAngle*Math.PI)/180;
    const x1 = cx+r*Math.cos(sr), y1 = cy+r*Math.sin(sr);
    const x2 = cx+r*Math.cos(er), y2 = cy+r*Math.sin(er);
    const large = angle>180?1:0;
    paths += `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;
    startAngle = endAngle;
  });
  return `<svg viewBox="0 0 180 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="#fff"/><text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="'Plus Jakarta Sans',sans-serif">¥${(total/10000).toFixed(1)}万</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#6B7280" font-family="'Plus Jakarta Sans',sans-serif">总销售额</text></svg>`;
}

function renderRankList(type) {
  const data = type==='sales' ? rankData.sales : rankData.conv;
  const max = type==='sales' ? data[0].sales : data[0].conv;
  const rankLabels = ['gold','silver','bronze'];
  const COLORS_POOL = ['#2563EB','#3B82F6','#60A5FA','#93C5FD','#BFDBFE',
                        '#7C3AED','#8B5CF6','#A78BFA','#C4B5FD','#DDD6FE'];
  return data.map((p,i)=>`
    <div class="rank-item">
      <div class="rank-num ${i<3?rankLabels[i]:''}">${i+1}</div>
      <div class="rank-avatar" style="background:${COLORS_POOL[i]}">${p.name[0]}</div>
      <div class="rank-info"><div class="rank-name">${p.name}</div><div class="rank-label">${type==='sales'?'销售业绩':'转化率'}</div></div>
      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${type==='sales'?(p.sales/max*100).toFixed(0):(p.conv/max*100).toFixed(0)}%;background:${COLORS_POOL[i]}"></div></div>
      <div class="rank-value">${type==='sales'?'¥'+(p.sales/10000).toFixed(2)+'万':(p.conv*100).toFixed(0)+'%'}</div>
    </div>`).join('');
}

// ===================== Tab Switching =====================
function initTrendTabs() {
  const wrap = document.getElementById('trendChartWrap');
  document.querySelectorAll('#trendTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#trendTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const key = btn.dataset.trend;
      wrap.innerHTML = generateLineChart(trendData[key], CHART_COLORS[key], 680, 220);
    });
  });
}

function initRankTabs() {
  const wrap = document.getElementById('rankListWrap');
  document.querySelectorAll('#rankTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#rankTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wrap.innerHTML = renderRankList(btn.dataset.rank);
    });
  });
}

// ===================== Toast =====================
function toast(msg, type) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.className = 'toast ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===================== Refresh =====================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    document.getElementById('refreshBadge').textContent = '刷新中...';
    // Simulate data refresh (re-render with slight random variance)
    setTimeout(() => {
      document.getElementById('pageContent').innerHTML = renderDashboard();
      initTrendTabs();
      initRankTabs();
      document.getElementById('refreshBadge').textContent = '刚刚更新';
      toast('仪表盘数据已刷新','success');
    }, 600);
  });
});

// ===================== Nav =====================
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', e => {
    const menu = item.dataset.menu;
    if (menu === 'stats') { e.preventDefault(); return; } // 当前页
    if (menu === 'leads' || menu === 'product' || menu === 'order' || menu === 'chat') { return; } // 让浏览器自然跳转
    e.preventDefault();
    toast('该模块为示例，当前仅线索管理、商品管理、订单管理、实时聊天与仪表盘可用','success');
  });
});

// ===================== INIT =====================
document.getElementById('pageContent').innerHTML = renderDashboard();
initTrendTabs();
initRankTabs();
</script>
